name: Build Zadanie 5 project

on:
  pull_request:
    branches: ["main"]
    paths:
      - "zadanie 5/**"
  push:
    branches: ["main"]
    paths:
      - "zadanie 5/**"

jobs:
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "./zadanie 5/backend"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ">=1.26.3"

      - name: Install dependencies
        run: go mod download

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "./zadanie 5/frontend"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

  build-docker:
    name: Verify Docker Compose Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "./zadanie 5"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker images
        run: docker compose build

  notify:
    name: Send Email Notification
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, build-docker]
    steps:
      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: GitHub Actions
          to: ${{ secrets.MAIL_TO }}
          subject: GitHub Actions Build Completed Successfully - ${{ github.repository }}
          body: |
            The build jobs for ${{ github.repository }} completed successfully.
            Commit: ${{ github.sha }}
            Triggered by: ${{ github.actor }}
