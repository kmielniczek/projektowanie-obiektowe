name: Lint zadanie 5 frontend

on:
  pull_request:
    paths:
      - "zadanie 5/frontend/**"
  push:
    branches:
      - main
    paths:
      - "zadanie 5/frontend/**"

jobs:
  lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: "zadanie 5/frontend"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
